[project]
name = "royal-analyzer-ai"
version = "0.1.0"
description = "Autonomous desktop analyzer for Royal dice sequences"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "playwright>=1.45",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "opencv-python>=4.10",
]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2", "torch>=2.3"]
ocr = ["easyocr>=1.7"]
test = ["pytest>=8.2"]
build = ["pyinstaller>=6.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
